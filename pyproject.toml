[project]
name = "beidou-smart-clip"
version = "0.3.0"
description = "一键式视频筛选与批量 15s 剪辑 · L0 本地分析层 + L1~L4 流水线骨架 + 平台画像与降重"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "numpy>=1.26",
    "pydantic>=2.6",
    "pyyaml>=6",
]

[project.scripts]
smartclip = "app.cli:main"

[project.optional-dependencies]
vision = ["torch>=2.2", "transformers>=4.45", "pillow>=10"]
dev = ["pytest>=8", "httpx>=0.27"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
