# 平台画像：视频类型划分 + 重复率判定规则（v1.0）
# 调研依据见 docs/platform-taxonomy-and-dedup.md（2026-08 调研，来源附 sources）
# 结论摘要：
#   - 仅 B 站有公开官方分区表（tid 体系）；抖音/快手/小红书无公开分区标准，
#     按"已降级"策略采用其创作者中心/热门话题标签体系归纳；
#   - Meta(Instagram/Facebook)、X 无内容分区，只有原创性/反 spam 政策；
#   - 判重普遍为多级：文件指纹(MD5) → 关键帧指纹 → AI 同质化语义，
#     小红书另有"3 个月时间窗"与信誉分机制。
# status=provisional：阈值为行业公开资料归纳，未经本地样本标定。

schema_version: platform-profiles-1.0
status: provisional
updated_at: "2026-08-20"

sources:
  - "bilibili 分区 tid 表: biliup.github.io/tid-ref.html（B 站官方分区查询接口同口径）"
  - "B 站投稿规范: 转载/自制二分 + 撞车规则（保留画质更高者）"
  - "小红书社区新规: 3 个月内重复内容判搬运；信誉分初始 10、上限 12、低于 8 限流 100%"
  - "Instagram/Meta Original Content Guidelines: unoriginal/aggregated 内容移出推荐流"
  - "X Copypasta and Duplicate Content Policy: 重复内容限制触达（按 spam 处理）"
  - "YouTube reused/repetitious content（2025-07 更新，降级参考平台）"
  - "抖音三级查重（MD5→关键帧→AI 同质化）与原创者联盟计划（公开报道归纳）"

# ---------- 视频类型划分 ----------

taxonomy:
  # 统一类目：本项目（短剧切片场景）的内部分类，各平台做 best-effort 映射。
  # mapping 中 bilibili 使用官方 tid；无官方分区的平台使用该平台热门内容标签。
  unified_categories:
    - id: drama_clip
      display_name: 短剧剧情切片
      platforms:
        douyin: [短剧, 剧情]
        kuaishou: [剧情, 短剧]
        bilibili: { name: 影视剪辑, tid: 183 }
        xiaohongshu: [影视综, 追剧]
        instagram: [Entertainment, Drama]
        x: [entertainment]
        youtube: [Entertainment]
    - id: hype_mashup
      display_name: 燃向混剪
      platforms:
        douyin: [影视剪辑, 燃向]
        kuaishou: [影视, 混剪]
        bilibili: { name: 影视剪辑, tid: 183 }
        xiaohongshu: [影视综]
        instagram: [Entertainment]
        x: [entertainment]
        youtube: [Entertainment]
    - id: fast_dialogue
      display_name: 快节奏对白
      platforms:
        douyin: [剧情, 短剧]
        kuaishou: [剧情]
        bilibili: { name: 短片, tid: 85 }
        xiaohongshu: [影视综]
        instagram: [Entertainment]
        x: [entertainment]
        youtube: [Entertainment]
    - id: emotional
      display_name: 情感/伤感
      platforms:
        douyin: [情感, 剧情]
        kuaishou: [情感, 剧情]
        bilibili: { name: 影视杂谈, tid: 182 }
        xiaohongshu: [情感, 影视综]
        instagram: [Entertainment]
        x: [entertainment]
        youtube: [Entertainment]
    - id: comedy
      display_name: 搞笑
      platforms:
        douyin: [搞笑]
        kuaishou: [搞笑]
        bilibili: { name: 搞笑, tid: 138 }
        xiaohongshu: [搞笑]
        instagram: [Comedy]
        x: [comedy]
        youtube: [Comedy]

  # 各平台发布规格（降重与剪辑计划消费）
  platform_specs:
