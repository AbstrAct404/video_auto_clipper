# ---------- 重复率判定与降重 ----------

dedup_rules:
  # 行业通用判重路径（多级漏斗）：先廉价后昂贵
  common_stages:
    - { id: file_hash, name: 文件指纹(MD5), cost: low }
    - { id: frame_fingerprint, name: 关键帧/抽帧指纹比对, cost: medium }
    - { id: grid_sampling, name: 九宫格抽帧比对, cost: medium }
    - { id: ai_homogenization, name: AI 同质化语义检测, cost: high }

  platforms:
    douyin:
      detection: [file_hash, frame_fingerprint, ai_homogenization]
      penalties: [降流量, 下架, 封禁]
      notes: 三级查重；原创者联盟计划提供全网侵权监测
    kuaishou:
      detection: [file_hash, frame_fingerprint]
      penalties: [降流量, 下架]
      notes: 社区管理规范按侵权/搬运处理，无公开阈值
    xiaohongshu:
      detection: [frame_fingerprint, ai_homogenization]
      window_days: 90            # 3 个月内出现重复内容即判搬运
      credit_score: { initial: 10, max: 12, full_traffic_block_below: 8 }
      penalties: [限流, 扣信誉分, 停用功能]
      notes: 信誉分低于 8 限流 100%；严打低成本二创
    bilibili:
      detection: [file_hash, frame_fingerprint]
      self_repost_split: true    # 自制/转载二分，投转载也算搬运
      collision_rule: 保留画质更高稿件
      penalties: [锁定稿件, 退回, 封禁]
      notes: UP 主版权保护计划主动维权
    instagram:
      detection: [frame_fingerprint, ai_homogenization]
      unoriginal_excluded_from_recommendation: true
      aggregation_penalized: true  # 聚合类账号整体降权（2026-04 扩展至图片/轮播）
      penalties: [移出推荐流, 账号降权]
      notes: Original Content Guidelines；无分区，仅原创性约束
    x:
      detection: [content_fingerprint]
      policy: copypasta_duplicate_content
      penalties: [限制触达]
      notes: 重复内容按 spam 处理，限制可见性而非下架
    youtube:                     # 降级参考平台（用户要求覆盖不到时补充）
      detection: [file_hash, frame_fingerprint, content_id]
      policies: [reused_content, repetitious_content]
      penalties: [禁止变现, 下架]
      notes: 2025-07 起 repetitious content 明确含批量生产内容

  # 本地降重分析判定阈值（provisional，待样本标定后调整）
  thresholds:
    similarity_review: 0.75      # 与参考片帧指纹相似度 ≥0.75 → review
    similarity_block: 0.90       # ≥0.90 → block（近似完全搬运）
    corner_static_watermark: 0.55  # 角落静态区域占比 ≥0.55 → 疑似残留水印
    black_bar_ratio_review: 0.12   # 黑边占比 ≥0.12 → 疑似未去源规格
